# Shared base for every spec in this repository (asciinema).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, platforms, announce, annotations — stays
# in that package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is deliberately NOT here: it is downstream of a per-package libc
# measurement, and a second package whose measurement differs would have to
# restate it in full anyway (silently dropping every `containers:` entry if it
# restated only the runners). It lives in asciinema/mirror.yml.

skip_prereleases: true
cascade: true

# The fleet rule. A cascade tag (`latest`, `X`, `X.Y`) re-points on every
# re-publish; without a build segment the new manifest reuses the bare version
# tag and orphans the prior digest for registry GC, breaking any `@sha256:` pin
# in a consumer's ocx.lock. asciinema versions as bare semver (`v3.2.1`), so
# there is no existing `+build` segment for `date` to collide with — the `none`
# exception does not apply here.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are single ~7-8 MB static/dynamic binaries, five per release.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>, and a raw-binary
# mirror has none — the executable IS the content root, so PATH is a bare
# ${installPath}. `auto` or `verify` is rejected at spec load with exit 65.
# `off` plus a hand-listed `binaries` in metadata.json is the blessed shape for
# `asset_type: binary`.
bin_scan: off

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
