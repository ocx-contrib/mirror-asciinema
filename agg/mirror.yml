extends: ../mirror-base.yml

name: agg

# Logical index package `asciinema/agg` lives at the physical path
# `ghcr.io/ocx-contrib/asciinema/agg` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own owner or `GITHUB_TOKEN` cannot
# create the package. Linkage to this repo comes from the
# `org.opencontainers.image.source` annotation the pipeline writes.
target:
  registry: ghcr.io
  repository: ocx-contrib/asciinema/agg

source:
  type: github_release
  owner: asciinema
  repo: agg
  # Every tag from v1.0.0 (floor) to v1.9.0 (newest, checked 2026-09-21) is a
  # plain `vX.Y.Z` with `prerelease: false` — no rc/beta segment has ever
  # shipped:
  #
  #   $ gh api repos/asciinema/agg/releases --jq '.[] | "\(.tag_name)\tprerelease=\(.prerelease)"'
  #   v1.9.0  prerelease=false
  #   v1.8.1  prerelease=false
  #   …
  #   v1.0.0  prerelease=false
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── Asset scope ────────────────────────────────────────────────────────────
#
# Raw binaries, no archive. Every release from v1.0.0 to v1.9.0 ships exactly
# these 7 assets (checked at both ends of the range plus v1.6.0/v1.8.0, and
# re-confirmed against the live v1.9.0 release when this spec was ported):
#
#   agg-aarch64-apple-darwin
#   agg-aarch64-unknown-linux-gnu
#   agg-arm-unknown-linux-gnueabihf   32-bit ARM — no OCX platform key, skip
#   agg-x86_64-apple-darwin
#   agg-x86_64-pc-windows-msvc.exe
#   agg-x86_64-unknown-linux-gnu
#   agg-x86_64-unknown-linux-musl
#
# No windows/arm64 and no linux/arm64 musl asset in any release checked —
# both are intentionally NOT mirrored, not a filter miss. No digest sidecars
# to exclude (anchored `^...$` regexes are still used for safety, matching
# fleet convention).
# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built, and the asset NAME never decides the key.
# Measured on the v1.9.0 assets:
#
#   $ file agg-x86_64-unknown-linux-musl
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ file agg-x86_64-unknown-linux-gnu
#   ELF 64-bit LSB pie executable, x86-64, dynamically linked,
#     interpreter /lib64/ld-linux-x86-64.so.2, for GNU/Linux 3.2.0, stripped
#   $ file agg-aarch64-unknown-linux-gnu
#   ELF 64-bit LSB pie executable, ARM aarch64, dynamically linked,
#     interpreter /lib/ld-linux-aarch64.so.1, for GNU/Linux 3.7.0, stripped
#
# The musl build is static-pie — NO PT_INTERP — so it requires nothing of the
# host and takes the BARE `linux/amd64` key. Tagging it `+libc.musl` would be
# a false requirement that hid it from every glibc host; the `-musl` filename
# is not evidence, PT_INTERP is. Same shape and same verdict as the sibling
# asciinema/mirror.yml. Both gnu builds are dynamically linked against glibc
# and take `+libc.glibc`.
#
# Bare and `+libc.glibc` publish side by side: matching is subset-based and
# scored by specificity, so a glibc host takes the gnu build ((1,1) outranks
# (1,0)) and a musl host takes the static one — deterministic, never
# Ambiguous.
assets:
  "linux/amd64+libc.glibc":
    - "^agg-x86_64-unknown-linux-gnu$"
  # Static-pie musl build — runs under ANY Linux userland, hence bare.
  "linux/amd64":
    - "^agg-x86_64-unknown-linux-musl$"
  "linux/arm64+libc.glibc":
    - "^agg-aarch64-unknown-linux-gnu$"
  darwin/amd64:
    - "^agg-x86_64-apple-darwin$"
  darwin/arm64:
    - "^agg-aarch64-apple-darwin$"
  windows/amd64:
    - "^agg-x86_64-pc-windows-msvc\\.exe$"

asset_type:
  # One raw binary per platform, versionless name. The Windows asset keeps
  # its `.exe` suffix from the source filename automatically.
  type: binary
  name: agg

metadata:
  # One shape on every platform — a single static binary, nothing else.
  default: metadata.json

catalog:
  # Each package carries its own logo copy (see repo README "Layout") rather
  # than sharing the root — a shared root logo.* sits in no workflow's
  # `paths:` filter, so replacing it would publish nothing until an unrelated
  # edit happened to fire. Same bytes as asciinema/logo.svg: the org IS the
  # brand (see asciinema/mirror.yml's namespace-rule comment), and agg ships
  # no icon of its own upstream.
  logo: logo.svg

versions:
  min: "1.0.0"
  new_per_run: 5
  # Hash-staggered, and it MUST come from the fleet's own generator — a
  # hand-rolled hash is not the same scheme and does not survive `--scan`:
  #   $ python3 .claude/skills/create-mirror/scripts/poll_stagger.py asciinema/agg
  #   slot: 256  (minute=16, hour-offset=4)  →  cron: 16 4-23/6 * * *
  # (sha3_256, full digest % 360 — the period is 6h, so the hour offset is
  # 0..5. A `%1440` variant yields offsets up to 23, and `9-23/6` then fires
  # only 3x/day instead of 4x.) Slot 256 collides with gitleaks/gitleaks,
  # which the scheme accepts — 16 fleet specs already share a slot — and
  # determinism is what stops the fleet-wide :00 burst that tripped GHCR's
  # secondary rate limit on 2026-08-04.
  poll_interval: "16 4-23/6 * * *"

tests:
  # `script:` paths resolve from the repository root, not from this spec's
  # directory — unlike `metadata.default` and `catalog.logo` above.
  - name: smoke
    script: agg/tests/smoke.star

platforms:
  # agg needs a monospace font to run its actual job (GIF rendering) — unlike
  # a launcher (bazelisk) or a build-system driver (cmake), it fails hard
  # with "no faces matching font family options" on a font-less host. A bare
  # `ubuntu:24.04`/`fedora:40`/`alpine:3.20` ships NONE (measured: `fc-list`
  # is not even installed on stock ubuntu:24.04). `containers[].setup`
  # provisions exactly one font package per image — the narrow, honest claim
  # the field exists for. "DejaVu Sans Mono" is already in agg's own default
  # `--text-font-family` fallback chain, so no CLI flag override is needed;
  # installing the package is enough for agg's own font resolution to find
  # it. Verified with `docker run` against the real v1.9.0 binaries before
  # this spec was written:
  #
  #   ubuntu:24.04 + fonts-dejavu-core        → renders, exit 0
  #   fedora:40    + dejavu-sans-mono-fonts   → renders, exit 0
  #   alpine:3.20  + ttf-dejavu (musl binary) → renders, exit 0
  #
  # darwin (Menlo) and windows (Consolas) need no setup: both are also in the
  # default fallback chain, and both ship on the GitHub-hosted runner images.
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    containers:
      - image: "ubuntu:24.04"
        shell: bash
        setup:
          - apt-get update
          - apt-get install -y fonts-dejavu-core
      - image: "fedora:40"
        shell: bash
        setup:
          - dnf install -y dejavu-sans-mono-fonts
  # The BARE key claims it runs under any Linux userland, so it must prove it:
  # ubuntu (glibc) + alpine (musl) + fedora (a different glibc vintage). The
  # alpine leg IS the proof — drop it and the universal claim is merely
  # asserted.
  "linux/amd64":
    runner: ubuntu-latest
    containers:
      - image: "ubuntu:24.04"
        shell: bash
        setup:
          - apt-get update
          - apt-get install -y fonts-dejavu-core
      - image: "alpine:3.20"
        shell: sh
        setup:
          - apk add --no-cache ttf-dejavu
      - image: "fedora:40"
        shell: bash
        setup:
          - dnf install -y dejavu-sans-mono-fonts
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer's guard reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - image: "ubuntu:24.04"
        shell: bash
        setup:
          - apt-get update
          - apt-get install -y fonts-dejavu-core
      - image: "fedora:40"
        shell: bash
        setup:
          - dnf install -y dejavu-sans-mono-fonts
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job (same
    # rationale as asciinema/mirror.yml darwin/amd64).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # $ gh api repos/asciinema/agg --jq '.license.spdx_id'  → GPL-3.0
  # `Cargo.toml` pins the precise expression `license = "GPL-3.0-or-later"`,
  # same disambiguation as asciinema/mirror.yml (GitHub's API reports only the
  # deprecated umbrella id) — recorded here and in NOTICE.md.
  org.opencontainers.image.licenses: "GPL-3.0-or-later"

announce:
  # Spelled out, not derived from target.repository — the logical name and
  # the physical path are related by convention only. Needs
  # OCX_ANNOUNCE_TOKEN (ocx-contrib org secret).
  package: asciinema/agg
  fork: ocx-contrib/index
